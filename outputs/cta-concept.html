<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROJECT 42 — концепт CTA</title>
    <style>
      @font-face {
        font-family: Golos;
        src: url('../public/fonts/golos-text-variable.ttf') format('truetype');
        font-weight: 400 900;
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: #090b0b; color: #f2f4ef; font-family: Golos, Arial, sans-serif; }
      .cta {
        position: relative;
        width: 1440px;
        height: 760px;
        overflow: hidden;
        padding: 52px 72px 42px;
        background: #090b0b;
      }
      .cta::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: .15;
        background-image: linear-gradient(#90bba822 1px, transparent 1px), linear-gradient(90deg, #90bba822 1px, transparent 1px);
        background-size: 82px 82px;
        mask-image: linear-gradient(90deg, transparent 43%, #000);
        pointer-events: none;
      }
      .frame {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 33px;
        padding-bottom: 18px;
        border-bottom: 1px solid #63766d66;
        color: #aebbb3;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: .14em;
      }
      .mark { display: flex; align-items: center; gap: 18px; }
      .mark strong { color: #eaf2ec; font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
      .mark span { width: 25px; height: 1px; background: #748f80; }
      .main {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(355px, .7fr);
        gap: 84px;
        align-items: end;
        padding-top: 103px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 11px;
        color: #c9ffe4;
        font-size: 13px;
        font-weight: 550;
        letter-spacing: .16em;
      }
      .eyebrow b { width: 7px; height: 7px; background: #c9ffe4; transform: rotate(45deg); }
      h1 {
        margin: 32px 0 0;
        font-size: 89px;
        font-weight: 500;
        line-height: 1.04;
        letter-spacing: -.065em;
      }
      h1 em { color: #c9ffe4; font-style: normal; }
      .side {
        padding: 0 0 7px 34px;
        border-left: 1px solid #73958380;
      }
      .index { margin-bottom: 32px; color: #a6b8ac; font-size: 13px; letter-spacing: .15em; }
      .copy { max-width: 370px; margin: 0; font-size: 23px; line-height: 1.38; letter-spacing: -.025em; }
      .button {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        height: 72px;
        margin-top: 37px;
        padding: 0 24px;
        border: 0;
        background: #c9ffe4;
        color: #0a1510;
        font: 650 16px Golos, Arial, sans-serif;
      }
      .button span:last-child { font-size: 30px; font-weight: 400; line-height: 1; }
      .note { margin-top: 17px; color: #899a90; font-size: 13px; }
      .bottom {
        position: absolute;
        right: 72px;
        bottom: 42px;
        left: 72px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding-top: 22px;
        border-top: 1px solid #63766d66;
      }
      .steps { display: flex; gap: 32px; color: #91a198; font-size: 12px; font-weight: 500; letter-spacing: .14em; }
      .steps span { display: flex; align-items: center; gap: 11px; }
      .steps b { color: #c9ffe4; font-weight: 500; }
      .number { color: #c9ffe4; font-size: 18px; font-weight: 500; letter-spacing: -.04em; }
    </style>
  </head>
  <body>
    <section class="cta" aria-label="Концепт CTA секции">
      <div class="frame">
        <div class="mark"><strong>PROJECT 42</strong><span></span> РАЗРАБОТКА САЙТОВ</div>
        <div>СЛЕДУЮЩИЙ ШАГ / 01</div>
      </div>
      <div class="main">
        <div>
          <div class="eyebrow"><b></b> ЕСТЬ ИДЕЯ?</div>
          <h1>Обсудим<br />ваш будущий<br /><em>сайт?</em></h1>
        </div>
        <div class="side">
          <div class="index">01 — НАЧНЁМ С РАЗГОВОРА</div>
          <p class="copy">Расскажите о задаче — поможем определить структуру, сроки и стоимость.</p>
          <button class="button" type="button"><span>Получить консультацию</span><span>↗</span></button>
          <div class="note">Обсудим детали и предложим следующий шаг.</div>
        </div>
      </div>
      <div class="bottom">
        <div class="steps"><span><b>01</b> СТРУКТУРА</span><span><b>02</b> ДИЗАЙН</span><span><b>03</b> РАЗРАБОТКА</span><span><b>04</b> ЗАПУСК</span></div>
        <div class="number">42 /</div>
      </div>
    </section>
  </body>
</html>
